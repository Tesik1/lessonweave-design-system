<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="LessonWeave">
<title>LessonWeave</title>
<style>
@keyframes lw-weave-top{0%,4.545%{opacity:0;transform:translateX(-36px);animation-timing-function:cubic-bezier(.25,.8,.25,1)}17.045%,100%{opacity:1;transform:none}}.lw-weave-top{animation:lw-weave-top 4.4s linear infinite both}
@keyframes lw-weave-left{0%,9.091%{opacity:0;transform:translateY(-36px);animation-timing-function:cubic-bezier(.25,.8,.25,1)}21.591%,100%{opacity:1;transform:none}}.lw-weave-left{animation:lw-weave-left 4.4s linear infinite both}
@keyframes lw-weave-right{0%,15.909%{opacity:0;transform:translateY(-36px);animation-timing-function:cubic-bezier(.25,.8,.25,1)}28.409%,100%{opacity:1;transform:none}}.lw-weave-right{animation:lw-weave-right 4.4s linear infinite both}
@keyframes lw-weave-bottom{0%,21.591%{opacity:0;transform:translateX(36px);animation-timing-function:cubic-bezier(.25,.8,.25,1)}34.091%,100%{opacity:1;transform:none}}.lw-weave-bottom{animation:lw-weave-bottom 4.4s linear infinite both}
@keyframes lw-weave-fade{0%,81.818%{opacity:1}89.773%,100%{opacity:0}}
.lw-weave{animation:lw-weave-fade 4.4s linear infinite both}
@media (prefers-reduced-motion:reduce){.lw-weave,.lw-weave *{animation:none!important}}
</style>
<g class="lw-weave">
<g transform="translate(0 0) scale(1)">
<defs>
<mask id="lw-mark-animated-under" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<path class="lw-weave-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
<path class="lw-weave-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
</mask>
<mask id="lw-mark-animated-verticals" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<path class="lw-weave-bottom" d="M28 68.5H52M28 91.5H52M68 68.5H92M68 91.5H92" stroke="#000" stroke-width="3"/>
</mask>
</defs>
<g mask="url(#lw-mark-animated-under)">
<path class="lw-weave-top" d="M10 30H110L103 40L110 50H10L17 40Z" style="fill:var(--module-flashcards, #D48A19)"/>
<path class="lw-weave-bottom" d="M10 70H110L103 80L110 90H10L17 80Z" style="fill:var(--module-insights, #4A4DB0)"/>
</g>
<g mask="url(#lw-mark-animated-verticals)">
<path class="lw-weave-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" style="fill:var(--module-practice, #2F7A78)"/>
<path class="lw-weave-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" style="fill:var(--module-planner, #8C4A78)"/>
</g>
<rect class="lw-weave-bottom" x="26" y="70" width="28" height="20" style="fill:var(--module-insights, #4A4DB0)"/>
<rect class="lw-weave-bottom" x="66" y="70" width="28" height="20" style="fill:var(--module-insights, #4A4DB0)"/>
</g>
</g>
</svg>
