<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="LessonWeave">
<title>LessonWeave</title>
<style>
@keyframes lw-beat-l{0%,100%{transform:none}30%{transform:translateX(-5px)}62%{transform:translateX(1.5px)}}
@keyframes lw-beat-r{0%,100%{transform:none}30%{transform:translateX(5px)}62%{transform:translateX(-1.5px)}}
@keyframes lw-beat-u{0%,100%{transform:none}30%{transform:translateY(-5px)}62%{transform:translateY(1.5px)}}
@keyframes lw-beat-d{0%,100%{transform:none}30%{transform:translateY(5px)}62%{transform:translateY(-1.5px)}}
:is(a,button):hover .lw-beat-top,:is(a,button):focus-visible .lw-beat-top,.lw-beat-run .lw-beat-top{animation:lw-beat-l .7s ease-in-out 0s both}
:is(a,button):hover .lw-beat-bottom,:is(a,button):focus-visible .lw-beat-bottom,.lw-beat-run .lw-beat-bottom{animation:lw-beat-r .7s ease-in-out 0s both}
:is(a,button):hover .lw-beat-left,:is(a,button):focus-visible .lw-beat-left,.lw-beat-run .lw-beat-left{animation:lw-beat-u .7s ease-in-out 0.06s both}
:is(a,button):hover .lw-beat-right,:is(a,button):focus-visible .lw-beat-right,.lw-beat-run .lw-beat-right{animation:lw-beat-d .7s ease-in-out 0.06s both}
@media (prefers-reduced-motion:reduce){.lw-beat,.lw-beat *{animation:none!important;transition:none!important}}
</style>
<g class="lw-beat">
<g transform="translate(0 0) scale(1)">
<defs>
<mask id="lw-mark-beat-under" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<g><path class="lw-beat-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>
<g><path class="lw-beat-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>
</mask>
<mask id="lw-mark-beat-verticals" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<g><path class="lw-beat-bottom" d="M28 68.5H52M28 91.5H52M68 68.5H92M68 91.5H92" stroke="#000" stroke-width="3"/></g>
</mask>
</defs>
<g mask="url(#lw-mark-beat-under)">
<g class="lw-beat-top-fade"><path class="lw-beat-top" d="M10 30H110L103 40L110 50H10L17 40Z" style="fill:var(--module-flashcards, #D48A19)"/></g>
</g>
<g mask="url(#lw-mark-beat-verticals)">
<g class="lw-beat-left-fade"><path class="lw-beat-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" style="fill:var(--module-practice, #2F7A78)"/></g>
<g class="lw-beat-right-fade"><path class="lw-beat-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" style="fill:var(--module-planner, #8C4A78)"/></g>
</g>
<g class="lw-beat-bottom-fade"><path class="lw-beat-bottom" d="M10 70H110L103 80L110 90H10L17 80Z" style="fill:var(--module-insights, #4A4DB0)"/></g>
</g>
</g>
</svg>
