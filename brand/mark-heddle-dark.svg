<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="LessonWeave">
<title>LessonWeave</title>
<style>
@keyframes lw-heddle-y{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
@keyframes lw-heddle-x{0%,100%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.lw-heddle-left{animation:lw-heddle-y 2.4s ease-in-out -1.8s infinite}
.lw-heddle-right{animation:lw-heddle-y 2.4s ease-in-out -.6s infinite}
.lw-heddle-top{animation:lw-heddle-x 2.4s ease-in-out infinite}
.lw-heddle-bottom{animation:lw-heddle-x 2.4s ease-in-out -1.2s infinite}
@media (prefers-reduced-motion:reduce){.lw-heddle,.lw-heddle *{animation:none!important;transition:none!important}}
</style>
<g class="lw-heddle">
<g transform="translate(0 0) scale(1)">
<defs>
<mask id="lw-mark-heddle-dark-under" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<g><path class="lw-heddle-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>
<g><path class="lw-heddle-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>
</mask>
<mask id="lw-mark-heddle-dark-verticals" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<g><path class="lw-heddle-bottom" d="M28 68.5H52M28 91.5H52M68 68.5H92M68 91.5H92" stroke="#000" stroke-width="3"/></g>
</mask>
</defs>
<g mask="url(#lw-mark-heddle-dark-under)">
<g class="lw-heddle-top-fade"><path class="lw-heddle-top" d="M10 30H110L103 40L110 50H10L17 40Z" style="fill:var(--module-flashcards, #EBC25A)"/></g>
</g>
<g mask="url(#lw-mark-heddle-dark-verticals)">
<g class="lw-heddle-left-fade"><path class="lw-heddle-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" style="fill:var(--module-practice, #74C9C7)"/></g>
<g class="lw-heddle-right-fade"><path class="lw-heddle-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" style="fill:var(--module-planner, #C48AB5)"/></g>
</g>
<g class="lw-heddle-bottom-fade"><path class="lw-heddle-bottom" d="M10 70H110L103 80L110 90H10L17 80Z" style="fill:var(--module-insights, #A3A6F2)"/></g>
</g>
</g>
</svg>
