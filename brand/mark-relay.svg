<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="LessonWeave">
<title>LessonWeave</title>
<style>
@keyframes lw-relay{0%,100%{opacity:.35}10%,35%{opacity:1}58%{opacity:.35}}
.lw-relay-top-fade{animation:lw-relay 1.6s ease-in-out -1.6s infinite both}
.lw-relay-right-fade{animation:lw-relay 1.6s ease-in-out -1.2s infinite both}
.lw-relay-bottom-fade{animation:lw-relay 1.6s ease-in-out -0.8s infinite both}
.lw-relay-left-fade{animation:lw-relay 1.6s ease-in-out -0.4s infinite both}
@media (prefers-reduced-motion:reduce){.lw-relay,.lw-relay *{animation:none!important;transition:none!important}}
</style>
<g class="lw-relay">
<g transform="translate(0 0) scale(1)">
<defs>
<mask id="lw-mark-relay-under" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<g><path class="lw-relay-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>
<g><path class="lw-relay-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>
</mask>
<mask id="lw-mark-relay-verticals" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
<rect width="120" height="120" fill="#fff"/>
<g><path class="lw-relay-bottom" d="M10 70H110L103 80L110 90H10L17 80Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/></g>
</mask>
</defs>
<g mask="url(#lw-mark-relay-under)">
<g class="lw-relay-top-fade"><path class="lw-relay-top" d="M10 30H110L103 40L110 50H10L17 40Z" style="fill:var(--module-flashcards, #D48A19)"/></g>
</g>
<g mask="url(#lw-mark-relay-verticals)">
<g class="lw-relay-left-fade"><path class="lw-relay-left" d="M30 10L40 17L50 10V110L40 103L30 110Z" style="fill:var(--module-practice, #2F7A78)"/></g>
<g class="lw-relay-right-fade"><path class="lw-relay-right" d="M70 10L80 17L90 10V110L80 103L70 110Z" style="fill:var(--module-planner, #8C4A78)"/></g>
</g>
<g class="lw-relay-bottom-fade"><path class="lw-relay-bottom" d="M10 70H110L103 80L110 90H10L17 80Z" style="fill:var(--module-insights, #4A4DB0)"/></g>
</g>
</g>
</svg>
